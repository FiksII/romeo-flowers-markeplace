{% load market_tags %}{% with current=request.resolver_match.url_name %}
<nav class="portal-nav" aria-label="Кабинет супер-администратора">
  <a href="{% url 'market:operator' %}"{% if current == 'operator' %} aria-current="page"{% endif %}>Дашборд</a>
  <a href="{% url 'market:operator-orders' %}"{% if current == 'operator-orders' or current == 'partner-order' %} aria-current="page"{% endif %}>Заказы</a>
  <a href="{% url 'market:operator-balances' %}"{% if current == 'operator-balances' %} aria-current="page"{% endif %}>Балансы и выплаты</a>
  <a href="{% url 'market:operator-settings' %}"{% if current == 'operator-settings' %} aria-current="page"{% endif %}>Настройки</a>
</nav>
{% disputed_payouts as disputed %}{% for payout in disputed %}<p class="notice error">{{ payout.shop.name }}: выплата {{ payout.amount|rub }} не получена. <a class="text-link" href="{% url 'market:operator-balances' %}">Разобраться</a></p>{% endfor %}
{% endwith %}
