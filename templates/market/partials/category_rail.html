{% load static %}
<nav class="category-chips" aria-label="Категории букетов">
  <a class="category-chip{% if not category_selected %} is-active{% endif %}" href="{{ all_categories_url }}" data-live-link{% if not category_selected %} aria-current="true"{% endif %}><span class="category-name">Все</span><small>{{ category_total }}</small></a>
  {% for item in category_options %}
    {% if item.count or item.selected %}
    <a class="category-chip{% if item.selected %} is-active{% endif %}" href="{{ item.url }}" data-live-link{% if item.selected %} aria-current="true" aria-label="{{ item.label }} — убрать фильтр"{% endif %}><img src="{% static item.image %}" alt="" width="28" height="28" loading="lazy"><span class="category-name">{{ item.label }}</span><small>{{ item.count }}</small></a>
    {% endif %}
  {% endfor %}
</nav>
