{% load static %}
<nav class="catalogue-categories" aria-label="Категории букетов">
  {% for item in category_options %}
    <a class="category-tile{% if item.selected %} is-active{% endif %}" href="{{ item.url }}" data-live-link{% if item.selected %} aria-current="true" aria-label="{{ item.label }} — убрать фильтр"{% endif %}>
      <img class="category-tile-image" src="{% static item.image %}" alt="" width="64" height="64" loading="lazy">
      <span class="category-name">{{ item.label }}</span>
      {% if item.selected %}{% include "storefront/partials/icon.html" with name="check" %}{% else %}{% include "storefront/partials/icon.html" with name="arrow-right" %}{% endif %}
    </a>
  {% endfor %}
</nav>
