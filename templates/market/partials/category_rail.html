{% load static %}<nav class="category-rail" aria-label="Категории букетов">{% for item in rail_categories %}<a class="category-circle{% if request.GET.category == item.value %} is-active{% endif %}" href="{% url 'market:catalogue' %}?category={{ item.value }}"{% if request.GET.category == item.value %} aria-current="true"{% endif %}><span class="category-image"><img src="{% static item.image %}" alt="" width="100" height="100"></span><span class="category-name">{{ item.label }}</span></a>{% endfor %}</nav>
