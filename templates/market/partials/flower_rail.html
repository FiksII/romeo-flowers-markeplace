{% load static market_tags %}{% if flower_rail %}<nav class="flower-rail" aria-label="Выбрать цветы">{% for flower in flower_rail %}<a class="flower{% if flower.active %} is-active{% endif %}" href="{{ flower.url }}" data-live-link aria-label="{{ flower.label }} — {{ flower.count }} {{ flower.count|ru_plural:'букет,букета,букетов' }}{% if flower.active %}, убрать фильтр{% endif %}"{% if flower.active %} aria-current="true"{% endif %}><span class="flower-image">{% if flower.image %}<img src="{% static flower.image %}" alt="" width="100" height="100" loading="lazy">{% else %}<span aria-hidden="true">✿</span>{% endif %}</span><span class="flower-name">{{ flower.label }}</span><small class="flower-count" data-flower-count="{{ flower.pk }}">{{ flower.count }}</small></a>{% endfor %}</nav>{% endif %}
