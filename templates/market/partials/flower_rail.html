{% load static %}{% if flower_rail %}<nav class="flower-rail" aria-label="Выбрать цветы">{% for flower in flower_rail %}<a class="flower{% if filters.flower == flower.pk|stringformat:'s' %} is-active{% endif %}" href="{% url 'market:catalogue' %}?flower={{ flower.pk }}"{% if filters.flower == flower.pk|stringformat:'s' %} aria-current="true"{% endif %}><span class="flower-image"><img src="{% static flower.image %}" alt="" width="100" height="100" loading="lazy"></span><span class="flower-name">{{ flower.label }}</span></a>{% endfor %}</nav>{% endif %}
