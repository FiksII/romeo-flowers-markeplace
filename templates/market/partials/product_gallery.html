{% load market_tags %}{% listing_gallery listing as gallery %}
<div class="bouquet-gallery{% if gallery|length > 1 %} has-thumbnails{% endif %}" data-bouquet-gallery aria-label="Фотографии букета">
  {% with main=gallery.0 %}<a class="bouquet-gallery-main" href="{{ main.original }}" data-gallery-original aria-haspopup="dialog" aria-label="Открыть фото букета в полном размере"><img class="detail-photo" src="{{ main.detail.src }}"{% if main.detail.srcset %} srcset="{{ main.detail.srcset }}" sizes="(max-width: 759px) {% if gallery|length > 1 %}calc(100vw - 90px){% else %}calc(100vw - 32px){% endif %}, 45vw"{% endif %} alt="{{ listing.product.title }}" width="640" height="800" data-gallery-main></a>{% endwith %}
  {% if gallery|length > 1 %}
  <p class="field-help gallery-counter" data-gallery-counter role="status" aria-live="polite">Фото 1 из {{ gallery|length }}</p>
  <div class="bouquet-gallery-rail"><div class="bouquet-gallery-thumbnails" aria-label="Выбрать фотографию">
    {% for image in gallery %}<a href="{{ image.original }}" class="bouquet-gallery-thumbnail" data-gallery-thumbnail data-src="{{ image.detail.src }}" data-srcset="{{ image.detail.srcset }}" aria-label="Фото {{ forloop.counter }} из {{ gallery|length }}"{% if forloop.first %} aria-current="true"{% endif %}><img src="{{ image.thumb.src }}"{% if image.thumb.srcset %} srcset="{{ image.thumb.srcset }}" sizes="(max-width: 759px) 48px, 72px"{% endif %} width="72" height="90" alt="{{ listing.product.title }} — фото {{ forloop.counter }}" loading="lazy"></a>{% endfor %}
  </div></div>{% endif %}
  <dialog class="photo-viewer" data-gallery-dialog aria-label="Фотографии букета {{ listing.product.title }}">
    <div class="photo-viewer-toolbar"><button type="button" data-gallery-zoom aria-pressed="false">Увеличить</button><button type="button" data-gallery-close autofocus aria-label="Закрыть просмотр фото">Закрыть ×</button></div>
    <div class="photo-viewer-stage"><img data-gallery-full alt="{{ listing.product.title }}"></div>
    <div class="photo-viewer-controls"><button type="button" data-gallery-previous aria-label="Предыдущее фото"{% if gallery|length == 1 %} hidden{% endif %}>←</button><p data-gallery-status role="status" aria-live="polite"></p><button type="button" data-gallery-next aria-label="Следующее фото"{% if gallery|length == 1 %} hidden{% endif %}>→</button><button type="button" data-gallery-retry hidden>Повторить загрузку</button></div>
  </dialog>
</div>
