{% load market_tags %}<article class="market-product"><a class="product-visual" href="{% url 'market:product' listing.pk %}"><img src="{{ listing.image_url }}" alt="{{ listing.product.title }}" loading="lazy" width="400" height="440"><span class="city-chip">{{ listing.shop.settlement.name }}</span></a><div class="product-copy"><a class="shop-label" href="{% url 'market:shop' listing.shop.slug %}">{{ listing.shop.name }}</a><h3><a href="{% url 'market:product' listing.pk %}">{{ listing.product.title }}</a></h3><p class="slot-caption">Получение {{ listing.nearest_slot.label }}</p><div class="product-bottom"><strong class="money">{{ listing.price|rub }}</strong><form method="post" action="{% url 'market:basket-add' listing.pk %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="add-button" aria-label="Добавить {{ listing.product.title }} в корзину">+</button></form></div></div></article>
